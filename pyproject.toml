[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nginx-set-conf"
version = "1.9.2"
description = "Python library for generating nginx reverse proxy configurations for Docker applications."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Equitania Software GmbH", email = "info@equitania.de" },
]
keywords = ["nginx", "configuration", "docker", "reverse-proxy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.2.1",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    "ruff>=0.15",
    "mypy>=1.20",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
    "bump-my-version>=1.3",
    "bandit>=1.8",
]

[project.scripts]
nginx-set-conf = "nginx_set_conf.nginx_set_conf:start_nginx_set_conf"

[project.urls]
Homepage = "https://github.com/equitania/nginx-set-conf"
Repository = "https://github.com/equitania/nginx-set-conf"
Issues = "https://github.com/equitania/nginx-set-conf/issues"

[tool.hatch.build.targets.wheel]
packages = ["nginx_set_conf"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "S",      # flake8-bandit
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S603",   # subprocess call - check for untrusted input (we validate inputs)
    "S607",   # starting a process with a partial path
    "W293",   # blank line contains whitespace (in template strings)
    "W291",   # trailing whitespace (in template strings)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=nginx_set_conf --cov-report=term-missing --cov-fail-under=70"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.bump-my-version]
current_version = "1.9.2"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bump-my-version.files]]
filename = "nginx_set_conf/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bump-my-version.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
