name: CI

on:
  push:
    branches: [main, develop, 2025]
  pull_request:
    branches: [main, develop, 2025]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Ruff (lint)
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Ruff (format check)
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Mypy (type check)
        run: uv run --python ${{ matrix.python-version }} mypy nginx_set_conf
        continue-on-error: true

      - name: Pytest (with coverage)
        run: uv run --python ${{ matrix.python-version }} pytest

  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Bandit scan
        run: uv run bandit -r nginx_set_conf -ll
